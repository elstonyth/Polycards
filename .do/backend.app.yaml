# DigitalOcean App Platform spec — polycards-backend (Mercur/Medusa).
#
# COMMITTED IaC (single source of truth). The 4 secret env values are redacted
# (placeholder tokens); the real values live in gitignored deploy/.env.deploy
# and are injected at apply time by scripts/do-apply.ps1. Never put a real
# secret in this file.
#
#   Validate (no live change):  pwsh scripts/do-apply.ps1 backend -Validate
#   Apply (redeploys prod):     pwsh scripts/do-apply.ps1 backend
#
# This file mirrors LIVE steady state. Edit here first, then apply — do not edit
# the app in the DO UI (that causes drift).
#
# Components all build from backend/Dockerfile (build context = backend/):
#   - service "backend" : Medusa web (API + /dashboard + /seller), MEDUSA_WORKER_MODE=server
#   - worker  "worker"  : drains event/workflow queues, MEDUSA_WORKER_MODE=worker
#   - job     "migrate" : PRE_DEPLOY `deploy:migrate-user` (db:migrate + idempotent
#                         create-admin) — runs every deploy, ensures the admin user
#                         exists. create-admin.ts checks for an existing user and
#                         SKIPS (no throw), so re-running is safe and self-healing.
#                         ADMIN_EMAIL/ADMIN_PASSWORD below feed it.
# Must match the LIVE app name, or `doctl apps update --spec` renames the app.
# App recreated 2026-07-16; default hostname is now polycards-backend-gce6p
# (DO assigns it at creation with a random suffix — unrelated to the app name).
name: polycards-backend
region: sgp

# Custom domain — REQUIRED here: `doctl apps update` replaces the FULL spec, so
# omitting this block would detach the domain. Serves the store API plus the
# dashboards (admin.polycards.gg/dashboard, /seller). DNS is a grey-cloud
# (DNS-only) CNAME in Cloudflare → polycards-backend-gce6p.ondigitalocean.app.
domains:
  - domain: admin.polycards.gg
    type: PRIMARY
    zone: polycards.gg

# App Platform alerts → email on failed deploys / failed custom-domain certs.
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# App-level envs are inherited by every component below.
envs:
  - key: NODE_ENV
    scope: RUN_AND_BUILD_TIME
    value: production
  # Baked into the admin/vendor vite bundles at BUILD time (Dockerfile ARG ->
  # ENV -> yarn build). Must be this app's own public origin so the dashboards
  # (served at /dashboard, /seller) call the same backend. Without it they ship
  # pointing at localhost:9000 -> blank/black dashboard.
  - key: MERCUR_BACKEND_URL
    scope: BUILD_TIME
    value: https://admin.polycards.gg
  # Storefront origin. BUILD: baked into the admin bundle (vite __STOREFRONT_URL__)
  # so the admin resolves storefront-relative asset paths against the real
  # storefront domain. RUN: read by the /cdn/cards redirect route. Also defaulted
  # in backend/Dockerfile (build) + the route (run) since App Platform doesn't
  # reliably pass build-time env.
  - key: MERCUR_STOREFRONT_URL
    scope: RUN_AND_BUILD_TIME
    value: https://polycards.gg
  # Storefront origin for links the BACKEND generates and emails (password reset —
  # subscribers/password-reset.ts) and for bake-slab's storefront-relative asset
  # resolution. Distinct from MERCUR_STOREFRONT_URL above, which Mercur reads under
  # its own name; both point at the same origin. Added 2026-07-17: without it the
  # subscriber's dev fallback (http://localhost:4000) would have gone out in every
  # production reset email, dead on arrival and burning the single-use token. The
  # subscriber now refuses to send when this is unset, so a missing value degrades to
  # a warn rather than garbage — but it must be present for reset email to work at
  # all. App level so the WORKER (which runs the subscriber) gets it too.
  - key: STOREFRONT_URL
    scope: RUN_TIME
    value: https://polycards.gg
  # Explicit PUBLIC endpoints (not the ${cluster.DATABASE_URL} binding): on an
  # attached production cluster the binding resolves to the PRIVATE host, which
  # the app (not in the DB's VPC) can't reach -> KnexTimeoutError. The public
  # host + the narrow `app:$APP_ID` trusted source is the "Public only" pattern.
  # No ?sslmode=require in the URL — the framework can't strip it and it would
  # force strict cert verify, defeating databaseDriverOptions.connection.ssl.
  - key: DATABASE_URL
    scope: RUN_TIME
    type: SECRET
    value: __SECRET__DATABASE_URL__
  - key: REDIS_URL
    scope: RUN_TIME
    type: SECRET
    value: __SECRET__REDIS_URL__
  - key: JWT_SECRET
    scope: RUN_TIME
    type: SECRET
    value: __SECRET__JWT_SECRET__
  - key: COOKIE_SECRET
    scope: RUN_TIME
    type: SECRET
    value: __SECRET__COOKIE_SECRET__
  # Super-admin for /dashboard login, created idempotently by the migrate job's
  # deploy:migrate-user (create-admin.ts). Skipped if the user already exists.
  - key: ADMIN_EMAIL
    scope: RUN_TIME
    value: admin@polycards.gg
  - key: ADMIN_PASSWORD
    scope: RUN_TIME
    type: SECRET
    value: __SECRET__ADMIN_PASSWORD__
  # CORS — explicit origins, comma-separated, no trailing slashes. The
  # dashboards are same-origin when opened on admin.polycards.gg (their bundles
  # call MERCUR_BACKEND_URL = that host); the app's own default hostname is also
  # listed so direct-to-default-host access still works. (The former `${APP_URL}`
  # literal was never a valid App Platform bindable — it only "worked" because
  # same-origin requests skip CORS.)
  - key: ADMIN_CORS
    scope: RUN_TIME
    value: https://admin.polycards.gg,https://polycards-backend-gce6p.ondigitalocean.app
  - key: AUTH_CORS
    scope: RUN_TIME
    value: https://admin.polycards.gg,https://polycards-backend-gce6p.ondigitalocean.app,https://polycards.gg,https://www.polycards.gg
  - key: VENDOR_CORS
    scope: RUN_TIME
    value: https://admin.polycards.gg,https://polycards-backend-gce6p.ondigitalocean.app
  - key: STORE_CORS
    scope: RUN_TIME
    value: https://polycards-storefront-fzrft.ondigitalocean.app,https://polycards.gg,https://www.polycards.gg
  # Object storage (DO Spaces, sgp1) — durable media. Without these the backend
  # falls back to the LOCAL file provider (medusa-config.ts s3Configured gate),
  # which writes to the container's EPHEMERAL disk and loses every upload on
  # redeploy/restart. S3_FILE_URL is the bucket's CDN host (public read). The two
  # key values are SECRET, injected from deploy/.env.deploy at apply time.
  - key: S3_BUCKET
    scope: RUN_TIME
    value: polycards-media
  - key: S3_REGION
    scope: RUN_TIME
    value: sgp1
  - key: S3_ENDPOINT
    scope: RUN_TIME
    value: https://sgp1.digitaloceanspaces.com
  - key: S3_FILE_URL
    scope: RUN_TIME
    value: https://polycards-media.sgp1.cdn.digitaloceanspaces.com
  - key: S3_ACCESS_KEY_ID
    scope: RUN_TIME
    type: SECRET
    value: __SECRET__S3_ACCESS_KEY_ID__
  - key: S3_SECRET_ACCESS_KEY
    scope: RUN_TIME
    type: SECRET
    value: __SECRET__S3_SECRET_ACCESS_KEY__
  # Google OAuth (storefront customer social login). All three are required for
  # the `google` auth provider to register (medusa-config.ts gates on them; a
  # missing one boots emailpass-only). CLIENT_ID + CALLBACK_URL are non-secret;
  # CLIENT_SECRET is injected from deploy/.env.deploy at apply time (do-apply.ps1
  # secret list). CALLBACK_URL is the default the storefront overrides per-request
  # with its own origin — it must match an Authorised redirect URI on the OAuth
  # client (Cloud project "polycards").
  - key: GOOGLE_CLIENT_ID
    scope: RUN_TIME
    value: 206640157304-h2jhoblti14pd96pik0im4l66s0a6o0v.apps.googleusercontent.com
  - key: GOOGLE_CLIENT_SECRET
    scope: RUN_TIME
    type: SECRET
    value: __SECRET__GOOGLE_CLIENT_SECRET__
  - key: GOOGLE_CALLBACK_URL
    scope: RUN_TIME
    value: https://polycards.gg/auth/google/callback
  # ── Resend (transactional email: password reset) ─────────────────────────────
  # API_KEY + FROM_EMAIL are BOTH required to register the provider on the `email`
  # channel; with either unset the backend boots on the local/feed provider only and
  # password-reset emails are skipped with a warn (medusa-config.ts and the
  # subscriber share ONE predicate — modules/resend/options.ts — so a partial config
  # degrades to that warn instead of throwing NOT_FOUND inside an event handler).
  #
  # These sit at APP level, NOT under services.backend, and that is load-bearing:
  # the auth.password_reset subscriber runs on the WORKER component
  # (MEDUSA_WORKER_MODE=worker drains the event queue), not the web service. Scoping
  # them to the service would leave the worker unconfigured and silently skip every
  # reset email. App-level envs reach both components.
  #
  # FROM_EMAIL is on the send.* SUBDOMAIN so its SPF/DKIM stay clear of the root
  # domain's Google Workspace mail records (root MX -> smtp.google.com). REPLY_TO is
  # optional; without it, customer replies to a transactional email go nowhere.
  - key: RESEND_API_KEY
    scope: RUN_TIME
    type: SECRET
    value: __SECRET__RESEND_API_KEY__
  - key: RESEND_FROM_EMAIL
    scope: RUN_TIME
    value: Polycards <noreply@send.polycards.gg>
  - key: RESEND_REPLY_TO
    scope: RUN_TIME
    value: support@polycards.gg
  # ── PriceCharting (daily market-price sync + admin add-from-PC search) ──────
  # APP level like Resend, and that is load-bearing: the sync-market-prices job
  # runs on the WORKER component, so a service-scoped token would leave every
  # nightly card sync skipping "no token" (exactly what happened Jul 15-23
  # after the rename cutover dropped this key from the new app's spec).
  - key: PRICECHARTING_API_TOKEN
    scope: RUN_TIME
    type: SECRET
    value: __SECRET__PRICECHARTING_API_TOKEN__
  # Required by Inventory > "Add from PC Collection". NOT a secret: it is the
  # public 26-char PriceCharting user id (their docs publish an example one), so
  # it is a plain value rather than a redacted-secret placeholder (do-apply.ps1
  # scans the WHOLE spec, comments included, so the literal placeholder token
  # must never appear in prose here). The token above
  # only AUTHENTICATES — it does NOT scope /api/offers to our account, so
  # without this key PriceCharting answers with EVERY user's offers and the
  # route refuses to run rather than import strangers' cards as our stock.
  - key: PRICECHARTING_SELLER_ID
    scope: RUN_TIME
    value: pwoe4lsq4pkxegdsoyyzvfjuza
  # ── Twilio Verify (SMS OTP) ────────────────────────────────────────────────
  # App level, like Resend: the OTP routes run on the SERVICE, but keeping the
  # scope uniform avoids the PriceCharting failure mode above (a component-
  # scoped key that the other component silently lacks). Values are injected
  # from gitignored deploy/.env.deploy by do-apply.ps1, same as every secret
  # here — all three names are in its required-key list, so a half-filled env
  # file fails the apply instead of shipping a broken half-configured gateway.
  #
  # Registering these does NOT enforce anything: sendPhoneOtp starts working,
  # but requireSignupPhoneProof / blockUnverifiedPhoneWrite stay open until
  # PHONE_VERIFICATION_REQUIRED is set below.
  #
  # PHONE_VERIFICATION_REQUIRED added 2026-08-04 (Deploy Order step 4) — the
  # storefront OTP UI shipped first (step 3, Dockerfile ARG + storefront spec),
  # and this spec must only be APPLIED after that storefront build is ACTIVE,
  # or phone signups 400 until it catches up. Rollback lever: set this to
  # "false" and re-apply — every gate opens instantly, storefront unaffected.
  #
  # Off for a few hours on 2026-08-07, then restored. Twilio refused every send
  # with 403 / error 21608, whose text blames trial accounts but which ALSO
  # fires on an upgraded account with no APPROVED PRIMARY COMPLIANCE PROFILE —
  # the actual state here. Upgrading to paid and funding it changed nothing; an
  # approved Individual profile did, and a live send then returned 201/pending.
  #
  # The flag had to move at all because PHONE_GATE_REQUIRED is unset and so
  # follows it: with a dead SMS transport and this on, every unverified account
  # was frozen out of topup / deposit / delivery with no way to verify out.
  #
  # If OTP breaks again, check IN THIS ORDER before touching any gate here —
  # all three are upstream of them: (1) primary compliance profile approved,
  # (2) account `type` + balance, (3) destination country in SMS geo
  # permissions. Re-arm is storefront ARG first, this second.
  - key: PHONE_VERIFICATION_REQUIRED
    scope: RUN_TIME
    value: "true"
  - key: TWILIO_ACCOUNT_SID
    scope: RUN_TIME
    type: SECRET
    value: __SECRET__TWILIO_ACCOUNT_SID__
  - key: TWILIO_AUTH_TOKEN
    scope: RUN_TIME
    type: SECRET
    value: __SECRET__TWILIO_AUTH_TOKEN__
  # Not strictly a credential (it is an identifier), but it pairs with the two
  # above and there is no value in leaking which Verify service is live.
  - key: TWILIO_VERIFY_SERVICE_SID
    scope: RUN_TIME
    type: SECRET
    value: __SECRET__TWILIO_VERIFY_SERVICE_SID__
  # Per-purpose Verify TEMPLATE SIDs — the mitigation for the cross-purpose OTP
  # pretext (audit run-5 hardening note). Twilio verifies on (phone, code)
  # ALONE, and the default template reads identically for all three flows, so a
  # code a victim reads back under a "verify your number" pretext is
  # exchangeable at POST /store/phone-verification/check for a 'password-reset'
  # proof — and that route returns a live reset token. The MAC'd `purpose` stops
  # a signup proof being REPLAYED at password-reset; it is a scope tag on the
  # token, not evidence of what the human agreed to. Naming the flow in the SMS
  # is what lets the person reading it refuse.
  #
  # otpTemplateSid() (src/utils/phone-verification.ts) falls back to Twilio's
  # default when a key is unset, so the feature ships DARK and each flow can be
  # switched on independently as its template clears Twilio's approval queue.
  # UNCOMMENT A LINE ONLY ONCE ITS TEMPLATE IS APPROVED — an unapproved or
  # mistyped SID makes Twilio reject the send (error 60xxx), which surfaces as
  # "the code never arrives", the exact failure shape the 21608 incident shows
  # costs a day to diagnose.
  #
  # Operator steps (Twilio Console → Verify → Templates):
  #   1. Create three SMS templates, each naming its flow in the body, e.g.
  #      "{{code}} is your Polycards sign-up code."
  #      "{{code}} is your Polycards phone-change code."
  #      "{{code}} is your Polycards PASSWORD RESET code. We will never ask you
  #       for it."
  #   2. Submit each for approval; wait for Approved.
  #   3. Paste each HJ… SID below, uncomment, and re-apply the spec.
  #
  # Plain values, NOT secrets: these are identifiers, and do-apply.ps1 aborts
  # the whole apply on any surviving redacted-secret placeholder (comments
  # included — do NOT write that token here, even to name it),
  # so never write one here for a non-secret.
  # - key: TWILIO_VERIFY_TEMPLATE_SID_SIGNUP
  #   scope: RUN_TIME
  #   value: "HJxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  # - key: TWILIO_VERIFY_TEMPLATE_SID_PHONE_CHANGE
  #   scope: RUN_TIME
  #   value: "HJxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  # - key: TWILIO_VERIFY_TEMPLATE_SID_PASSWORD_RESET
  #   scope: RUN_TIME
  #   value: "HJxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  # Destination geo-lock for the UNAUTHENTICATED send route: every call there
  # bills a real SMS, and the per-phone limiter bounds one number, not a pumping
  # run rotating fresh ones. Plain value, NOT a secret — do-apply.ps1 aborts the
  # whole apply if any redacted-secret placeholder survives substitution, so
  # never write one here for a non-secret. Empty/unset falls back to MY in code.
  # Widening this alone is not enough: the ISO->dialling-code row in
  # src/utils/phone-verification.ts and the storefront's ALLOWED_PHONE_COUNTRIES
  # must move in the same change, or the picker offers a country whose code
  # never arrives. Twilio's own SMS geo permissions are the upstream half.
  - key: ALLOWED_SMS_COUNTRIES
    scope: RUN_TIME
    value: "MY"
  # ── Telegram apex-pull board (Legendary+ pulls → the public channel) ────────
  # Both keys were applied straight to the live app on 2026-08-21 (a surgical
  # `doctl apps update`, because this integration shipped after that day's spec
  # work). They are mirrored here because App Platform REPLACES the whole spec
  # on apply — it does not merge — so a spec without them would silently delete
  # them from production and turn the board off with no error anywhere.
  #
  # APP level, not services.backend: the pack.opened subscriber runs on the
  # WORKER component, exactly like the Resend password-reset subscriber above.
  # Scoped to the service, the worker would boot unconfigured and every apex
  # pull would be a silent no-op.
  #
  # CHAT_ID is QUOTED and must stay quoted — it starts with '-', so unquoted
  # YAML parses it as a negative number and the API rejects the spec. Numeric
  # id over @polycardsgg on purpose: it survives a channel rename.
  # TELEGRAM_MIN_RARITY is deliberately unset (defaults to Legendary, which
  # means Legendary + Immortal — this repo's RARITY_ORDER puts Mythical BELOW
  # Legendary). Set it to 'Mythical' to widen the board by one tier.
  - key: TELEGRAM_BOT_TOKEN
    scope: RUN_TIME
    type: SECRET
    value: __SECRET__TELEGRAM_BOT_TOKEN__
  - key: TELEGRAM_CHAT_ID
    scope: RUN_TIME
    value: "-1003945115527"
  # ── Money switches. The GLOBEPAY_* names predate the gateway seam and are
  # kept because every runbook and alert knows them; they are gateway-neutral
  # master switches (the GlobePay365 integration itself was removed
  # 2026-09-06 — its settled rows remain as history on the audit panel).
  # Fail closed: without ENABLED the deposit route refuses every top-up.
  - key: GLOBEPAY_ENABLED
    scope: RUN_TIME
    value: "true"
  # Withdrawals ARMED 2026-08-05 (operator decision). The customer withdrawal
  # route and the admin held-approval both refuse while this is off.
  # NEXT_PUBLIC_WITHDRAWALS_ENABLED flips on the storefront in the same window
  # (Dockerfile ARG default + .do/storefront.app.yaml, both).
  - key: GLOBEPAY_WITHDRAWALS_ENABLED
    scope: RUN_TIME
    value: "true"
  # Where the customer's browser lands after the gateway's checkout — the
  # pretty storefront domain (customer-facing, unlike the callback base below).
  - key: PAYMENT_RETURN_URL
    scope: RUN_TIME
    value: https://polycards.gg/transactions

  # Cooling-off window on a newly saved payout destination, in hours. The code
  # default is 24; "0" here switches it OFF, so a bank account can be withdrawn
  # to the moment it is saved. Operator decision, 2026-08-11 — the 24h wait was
  # blocking real customers on their first withdrawal.
  #
  # KNOW WHAT THIS COSTS BEFORE RAISING IT AGAIN OR LEAVING IT: the window was
  # the delay that let an account owner react to "steal a token, add a bank
  # account, cash out". With it at 0 the only thing left in that path is the
  # add-a-destination email + feed alert (modules/packs/saved-account-notice.ts),
  # which now has to be the whole defence — so RESEND_API_KEY breaking is a
  # security incident here, not just a missing email. Restore the wait by
  # deleting this key (back to 24) or setting a positive number of hours.
  - key: PAYOUT_DESTINATION_COOLDOWN_HOURS
    scope: RUN_TIME
    value: "0"

  # ── TGPay (plan 130) — the payment gateway since the 2026-09-06 cutover.
  # The key pair comes from the production back office (admin.tgpay365.com →
  # Settings → General → API keys, 2FA-gated) and is injected by
  # scripts/do-apply.ps1. The production keys are short opaque strings, not
  # the sandbox's pk-/sk- shape — quoted because an all-digit value would
  # otherwise parse as a YAML number and doctl refuses it ("cannot unmarshal
  # number into ... value of type string").
  #
  # PAYMENT_CALLBACK_BASE derives each gateway's notify URLs from its hook
  # paths. THE APP'S OWN ORIGIN HOSTNAME, NOT admin.polycards.gg: that name is
  # proxied through Cloudflare, whose Bot Fight Mode answered every gateway
  # callback with a Managed Challenge on 2026-08-11 (a webhook cannot solve a
  # browser challenge, so every top-up fell back to the reconciliation sweep).
  # On the free plan that mode is zone-wide, so machine-to-machine callbacks
  # stay off the proxied hostname entirely; the routes are authenticated by
  # the gateway's key headers and the source allowlist, never by the edge.
  # TGPAY_CALLBACK_IPS is the source allowlist TGPay asked for — their servers
  # as listed 2026-09-05. Outside the sandbox the TGPay hooks refuse every
  # callback while this is unset, so it ships alongside the code.
  # PAYMENT_GATEWAY is the boot/fallback gateway, read while the admin
  # setting (site_settings.payment_gateway) is NULL. Set to tgpay at the
  # 2026-09-06 cutover: production deposits and payouts go through TGPay
  # from this apply on; GlobePay stays only to settle its own historical rows
  # until it is removed.
  - key: PAYMENT_GATEWAY
    scope: RUN_TIME
    value: tgpay
  - key: TGPAY_API_BASE
    scope: RUN_TIME
    value: https://api.tgpay365.com/api/v2
  - key: TGPAY_PUBLIC_KEY
    scope: RUN_TIME
    type: SECRET
    value: "__SECRET__TGPAY_PUBLIC_KEY__"
  - key: TGPAY_SECRET_KEY
    scope: RUN_TIME
    type: SECRET
    value: "__SECRET__TGPAY_SECRET_KEY__"
  - key: PAYMENT_CALLBACK_BASE
    scope: RUN_TIME
    value: https://polycards-backend-gce6p.ondigitalocean.app
  - key: TGPAY_CALLBACK_IPS
    scope: RUN_TIME
    value: 1.32.102.191,1.32.102.19,60.48.120.36,219.95.78.237,1.32.102.35,219.94.46.237,1.32.102.1,18.142.49.112,188.114.96.0,188.114.97.0,47.131.132.118,54.251.58.7

# Dedicated outbound IPs. DO assigns one per component (the service makes the
# customer-facing calls, the worker runs the reconciliation sweeps) and
# GlobePay365 runs an ACTIVE API whitelist keyed on those exact addresses, so
# BOTH have to be on their list.
#
# This block lives here because `doctl apps update` replaces the whole spec:
# on 2026-07-30 a do-apply from a spec without it silently released the IPs
# assigned the day before (deployment 2779c7a6, egress null — app stayed
# ACTIVE and healthy, only outbound calls to them would have been rejected).
# Never drop it. After any egress toggle, re-read the assigned addresses
# (`doctl apps get <id> -o json` → dedicated_ips) and re-send them to
# GlobePay365 if they changed — a reallocation is invisible from our side.
egress:
  type: DEDICATED_IP

# Routing. Present because `doctl apps update` replaces the FULL spec and the
# live app carries this block — with one service DO would regenerate an
# equivalent default, but matching live exactly keeps the apply a no-op for
# everything except the values we meant to change. (Same rationale as the
# storefront spec's copy of this block.)
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: backend

services:
  - name: backend
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    github:
      repo: elstonyth/Polycards
      branch: master
      deploy_on_push: true
    http_port: 9000
    # professional-xs, not basic-xs, ONLY because the basic tier is hard-capped
    # at one instance — `doctl apps propose` rejects instance_count: 2 with
    # "must not exceed 1 instance for instance_size_slug basic-xs". Same 1 shared
    # vCPU and 1 GiB for $12/mo instead of $10; the tier buys horizontal scaling
    # (and unlocks autoscaling), not a faster box.
    instance_size_slug: professional-xs
    # TWO is the ceiling here, and the arithmetic is the reason — this is not a
    # budget choice. The cluster is db-s-1vcpu-1gb: 25 connections, ~22 usable.
    # Every backend process opens up to DEFAULT_DB_POOL_MAX (5, see
    # src/utils/db-driver-options.ts), and the PRE_DEPLOY migrate job runs while
    # the old containers are still serving. 2 x 5 + worker 5 + migrate 5 = 20,
    # which leaves room for an operator psql. A THIRD instance is 25 and
    # exhausts the cluster mid-deploy — every acquire then fails with
    # KnexTimeoutError against a perfectly healthy database, which is the exact
    # outage the pool cap was written to prevent. Raise the cluster first, or
    # lower DB_POOL_MAX in step, before going past 2.
    instance_count: 2
    health_check:
      http_path: /health
    alerts:
      - rule: CPU_UTILIZATION
        value: 80
        operator: GREATER_THAN
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        value: 85
        operator: GREATER_THAN
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        value: 5
        operator: GREATER_THAN
        window: FIVE_MINUTES
    envs:
      - key: MEDUSA_WORKER_MODE
        scope: RUN_TIME
        value: server

workers:
  - name: worker
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    github:
      repo: elstonyth/Polycards
      branch: master
      deploy_on_push: true
    # basic-s, not basic-xxs: this component does a full Medusa boot, and on
    # 2.19 that no longer fits in 512 MB — the container is OOM-killed mid-boot
    # with a bare "exit code: 128" and no stack trace. Raised 2026-08-26 with
    # the migrate job below, after that job died the same way.
    instance_size_slug: basic-s
    instance_count: 1
    run_command: corepack yarn start
    # This component runs the scheduled jobs, including the GlobePay deposit
    # reconcile sweep. Callbacks are not delivered in production, so that sweep
    # is the ONLY writer that credits a paid deposit — if this worker is down,
    # customers pay at the bank and their balance never moves, silently, while
    # the web service stays green. A worker has no HTTP health check, so these
    # rules are the only signal. Thresholds mirror the service component.
    alerts:
      - rule: MEM_UTILIZATION
        value: 85
        operator: GREATER_THAN
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        value: 5
        operator: GREATER_THAN
        window: FIVE_MINUTES
    envs:
      - key: MEDUSA_WORKER_MODE
        scope: RUN_TIME
        value: worker

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    github:
      repo: elstonyth/Polycards
      branch: master
    # basic-s, not basic-xxs: deploy:migrate-user runs two `medusa exec`
    # scripts after db:migrate, each a full app boot, which OOM-kills a 512 MB
    # job on 2.19 (silent "exit code: 128"). See the worker note above.
    instance_size_slug: basic-s
    # Explicit because the live app carries it — see the ingress note above.
    instance_count: 1
    run_command: corepack yarn deploy:migrate-user

databases:
  - name: polycards-pg
    engine: PG
    production: true
    cluster_name: polycards-pg
  # Valkey is attached with engine REDIS (redis-compatible) — App Platform only
  # resolves the binding under the REDIS enum. REDIS_URL is set explicitly above.
  - name: polycards-valkey
    engine: REDIS
    production: true
    cluster_name: polycards-valkey
