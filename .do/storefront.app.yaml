# DigitalOcean App Platform spec — polycards-storefront (Next.js 16).
#
# COMMITTED IaC (single source of truth). No secrets here: the backend URL and
# the publishable key are NEXT_PUBLIC_* (public by design) and are baked at
# BUILD time, so the backend must already be live before a build.
#
#   Validate (no live change):  pwsh scripts/do-apply.ps1 storefront -Validate
#   Apply (redeploys prod):     pwsh scripts/do-apply.ps1 storefront
#
# Edit here first, then apply — do not edit the app in the DO UI (drift).
# Must match the LIVE app name, or `doctl apps update --spec` renames the app.
# App recreated 2026-07-16; default hostname is now polycards-storefront-fzrft
# (DO assigns it at creation with a random suffix — unrelated to the app name).
name: polycards-storefront
region: sgp

# Custom domains — REQUIRED here: `doctl apps update` replaces the FULL spec,
# so omitting this block would detach polycards.gg from the app. DNS lives in
# Cloudflare as grey-cloud (DNS-only) CNAMEs to the default ondigitalocean host.
domains:
  - domain: polycards.gg
    type: PRIMARY
  - domain: www.polycards.gg
    type: ALIAS
    zone: polycards.gg

# App Platform alerts → email on failed deploys / failed custom-domain certs.
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# Routing. Present because `doctl apps update` replaces the FULL spec and the
# live app carries this block — with one service DO would regenerate an
# equivalent default, but matching live exactly keeps the apply a no-op for
# everything except the values we meant to change.
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: storefront

services:
  - name: storefront
    dockerfile_path: Dockerfile
    github:
      repo: elstonyth/Polycards
      branch: master
      deploy_on_push: true
    http_port: 3000
    # basic-xs, NOT basic-xxs: the 512 MB box ran the storefront out of memory
    # in production (mem pinned ~99%, CPU idle, /healthz UNHEALTHY, 503s). The
    # live app was bumped by hand; this spec lagged behind, so applying the old
    # value would re-create the outage. Keep it in step with NODE_OPTIONS below.
    instance_size_slug: basic-xs
    instance_count: 1
    health_check:
      http_path: /healthz
    alerts:
      - rule: CPU_UTILIZATION
        value: 80
        operator: GREATER_THAN
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        value: 85
        operator: GREATER_THAN
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        value: 5
        operator: GREATER_THAN
        window: FIVE_MINUTES
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      # NOTE(custom-domain): this URL/key pair is ALSO hardcoded as ARG defaults
      # in the root Dockerfile (NEXT_PUBLIC_*) and backend/Dockerfile
      # (MERCUR_BACKEND_URL / MERCUR_STOREFRONT_URL) — App Platform doesn't
      # reliably pass build-time env, so the Dockerfile defaults ARE the prod
      # values. A domain move must update all of them together.
      - key: NEXT_PUBLIC_MEDUSA_BACKEND_URL
        scope: RUN_AND_BUILD_TIME
        value: https://admin.polycards.gg
      - key: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
        scope: RUN_AND_BUILD_TIME
        value: pk_86273b7c12ca5b2fd838bf1c1cf6427dbb6ef41c723d8af1efa20db183517534
      # Canonical public origin (invite links, metadataBase, sitemap). Also an
      # ARG default in the root Dockerfile — App Platform doesn't reliably pass
      # build-time env, so the Dockerfile default is what actually bakes in.
      # Set to the live DO host; on a custom-domain move update this + the
      # Dockerfile ARG + backend MERCUR_STOREFRONT_URL together.
      - key: NEXT_PUBLIC_SITE_URL
        scope: RUN_AND_BUILD_TIME
        value: https://polycards.gg
      # Which top-up sheet the storefront renders: 'globepay' redirects to the
      # real cashier, anything else keeps the mock. Cut over 2026-08-04, once
      # the backend spec carried GLOBEPAY_ENABLED=true + the three secrets and
      # ALLOW_MOCK_TOPUP was gone from production — at that point the mock sheet
      # posted to a route that refuses (topup-credits.ts), so leaving it was a
      # dead-end button, not a safe default.
      #
      # READ THIS BEFORE CHANGING IT: Next inlines NEXT_PUBLIC_* at BUILD time,
      # and per the note above App Platform does not reliably pass build-time
      # env — the root Dockerfile's ARG DEFAULT is what actually lands in the
      # bundle. Changing this value ALONE will not switch the sheet; it moves
      # with ARG NEXT_PUBLIC_PAYMENTS_PROVIDER in the root Dockerfile.
      - key: NEXT_PUBLIC_PAYMENTS_PROVIDER
        scope: RUN_AND_BUILD_TIME
        value: globepay
      # DEPOSIT_METHODS_ENABLED — deliberately NOT set here. Add it only to
      # retract a deposit channel:
      #
      #   - key: DEPOSIT_METHODS_ENABLED
      #     scope: RUN_TIME
      #     value: BQR                 # QR only; pulls online banking
      #
      # Unset means every provisioned channel, so leaving it out is also what
      # keeps a future third channel from needing a spec edit to reach anyone.
      # Same for a value naming nothing recognised: it degrades to all of them
      # and logs, because a typo must not leave customers unable to pay. To stop
      # top-ups ENTIRELY, use GLOBEPAY_ENABLED on the backend instead.
      #
      # This is the per-channel lever now — the storefront names a method on
      # every deposit request, so the backend's GLOBEPAY_DEPOSIT_METHOD is a
      # fallback customer traffic never reaches. It matters because OB (online
      # banking) has never been proven live: GetSupportedBanks answered 200 for
      # it all through the 2026-08-06 outage while every OB deposit was refused.
      #
      # Unlike the flag above this is NOT a NEXT_PUBLIC and NOT read in the root
      # layout — the sheet asks a server action on open, and startDeposit
      # re-checks the code. Layout-resolving it would have baked the list into
      # the prerendered routes (/task, /about, …) at BUILD time, i.e. exactly
      # the trap the note above this describes. Retracting is a spec apply plus
      # a restart, with no rebuild, on every route.
      # Enforce the CSP. Without this, next.config.ts serves
      # Content-Security-Policy-Report-Only — report-only had a clean run
      # (qa:csp + Sentry), flip assessed safe. GO-LIVE checklist: must be true.
      # NOTE: takes effect on the next `do-apply.ps1 storefront` (spec envs
      # apply via doctl, not on git push).
      - key: CSP_ENFORCE
        scope: RUN_AND_BUILD_TIME
        value: 'true'
      # Spaces CDN media host — baked into the client bundle (next.config.ts
      # remotePatterns) so next/image renders uploaded card/pack art from the
      # bucket. Host only, no protocol. Must rebuild the storefront to change it.
      - key: NEXT_PUBLIC_MEDIA_HOST
        scope: RUN_AND_BUILD_TIME
        value: polycards-media.sgp1.cdn.digitaloceanspaces.com
      # Node heap ceiling, set alongside the basic-xs bump above. Without it the
      # container OOMs before V8 ever collects. RUN_TIME only — the build box is
      # a different, larger machine.
      - key: NODE_OPTIONS
        scope: RUN_TIME
        value: --max-old-space-size=896
      - key: NEXT_TELEMETRY_DISABLED
        scope: RUN_AND_BUILD_TIME
        value: '1'
      # Phone-OTP UI gate. Build-time inlined, so flipping this needs a REBUILD,
      # not a restart — and it must not go true until the backend is already
      # serving /store/phone-verification/* with the Twilio secrets set, or the
      # signup sheet renders an OTP step that 404s. CONTEXT.md → Deploy Order:
      # this is step 3, the backend PHONE_VERIFICATION_REQUIRED flag is step 4.
      # Enabled 2026-08-04 (backend routes + Twilio verified live first). Like
      # every NEXT_PUBLIC_* here, the root Dockerfile ARG default is what the
      # bundle actually gets — this key moves together with that ARG.
      # Off for a few hours on 2026-08-07 (Twilio 21608 — no approved primary
      # compliance profile); re-armed the same day once an Individual profile
      # was twilio-approved and a live send returned 201/pending.
      - key: NEXT_PUBLIC_PHONE_VERIFICATION_REQUIRED
        scope: RUN_AND_BUILD_TIME
        value: 'true'
      # Withdrawal UI gate (/bank-withdrawal form + saved-accounts flow).
      # Armed 2026-08-05 together with the backend's
      # GLOBEPAY_WITHDRAWALS_ENABLED — the backend flag is the real money gate
      # (fail closed), this one only decides whether the form renders instead
      # of the "not open yet" notice. Build-time inlined like every
      # NEXT_PUBLIC_* here: the root Dockerfile ARG default is what the bundle
      # actually gets — this key moves together with that ARG.
      - key: NEXT_PUBLIC_WITHDRAWALS_ENABLED
        scope: RUN_AND_BUILD_TIME
        value: 'true'
