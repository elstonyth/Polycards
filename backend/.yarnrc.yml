nodeLinker: node-modules
nmHoistingLimits: workspaces

# registry.yarnpkg.com intermittently 429s when the CI backend jobs resolve
# concurrently on a lockfile-change day (node_modules cache miss) — 14 of them
# since 2026-11-09 (10 integration-http shards, 2 backend-unit shards,
# integration-modules, backend-quality). Caches are saved from master pushes
# only, so on a lockfile-change PR EVERY push misses and re-fetches the
# changed packages, not just the first. The default 3 retries (YN0035 "Request
# Retry Count: 3") give up before the rate limit clears. More retries + a
# longer per-request timeout ride it out.
httpRetry: 6
httpTimeout: 60000
