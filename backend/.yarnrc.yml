nodeLinker: node-modules
nmHoistingLimits: workspaces

# registry.yarnpkg.com intermittently 429s when the 8 CI matrix shards resolve
# concurrently on a lockfile-change day (node_modules cache miss); the default
# 3 retries (YN0035 "Request Retry Count: 3") give up before the rate limit
# clears. More retries + a longer per-request timeout ride it out.
httpRetry: 6
httpTimeout: 60000
