# Dependency update automation (DevOps audit M7). Minor+patch bumps are grouped
# into one PR per ecosystem to keep solo-maintainer noise down; majors stay
# individual so breaking changes get their own review.
#
# Framework packages are EXCLUDED from the grouped minor-and-patch PRs: for a
# framework, a semver-*minor* bump is routinely breaking (e.g. @medusajs 2.13→2.17
# broke API route registration and was merged as a "minor-and-patch" group — see
# the revert of #93). Excluding them means they still get PRs, but as individual,
# reviewable ones that are never bundled into an unattended group.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        exclude-patterns:
          - 'next'
        update-types:
          - minor
          - patch
    # Root is majors-current on React 19 today; this only blocks an AUTOMATED
    # solo half-bump of the pair going forward (deliberate manual bumps are
    # unaffected) — same react/react-dom lockstep reasoning as the /backend
    # updater below, applied here so the root updater can't recreate the
    # mismatch on its own.
    ignore:
      - dependency-name: 'react'
        update-types:
          - version-update:semver-major
      - dependency-name: 'react-dom'
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        exclude-patterns:
          - '@medusajs/*'
          - '@mercurjs/*'
        update-types:
          - minor
          - patch
    # The @medusajs/* packages in backend/packages/api are lockstep-pinned to one
    # exact version (2.13.4 today). A minor bump of ONE of them is a version skew
    # across the family, and 2.13->2.17 is known to break API route registration:
    # it landed once as a grouped bump and was reverted (#93), then reproduced on
    # all 8 integration-http shards in #235 ("Cannot read properties of undefined
    # (reading 'def')" at @medusajs/medusa/src/loaders/api.ts). Per-PR
    # `@dependabot ignore` comments only silence one package at a time — six more
    # siblings can each open the same broken PR the following week (#234/#235 did
    # exactly that after admin-sdk was ignored in #158).
    #
    # So: minor/major updates for these two families are ignored here. PATCH
    # updates are still allowed (safe inside the pinned minor). The family moves
    # via a deliberate coordinated upgrade — all @medusajs/* + @mercurjs/*
    # together, with the integration suites as the gate — at which point remove
    # or narrow these entries.
    ignore:
      - dependency-name: '@medusajs/*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: '@mercurjs/*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # PR #279 bumped react-dom to 19.x alone, leaving react pinned at 18 —
      # @mercurjs/admin peer-depends on React 18, so react-dom must move in
      # lockstep with react, never ahead of it on its own. A semver-major
      # react-dom PR is exactly the shape that broke last time; blocking it
      # here (like the @medusajs/@mercurjs families above) means the pair can
      # only be bumped to 19 together, deliberately, in one reviewed PR.
      - dependency-name: 'react-dom'
        update-types:
          - version-update:semver-major
      # Mirror of the react-dom ignore above: the pair moves together
      # deliberately, so a solo react major bump is blocked too.
      - dependency-name: 'react'
        update-types:
          - version-update:semver-major
      # #317 bumped plugin-react to 6.x against our vite 6.4.3 — plugin-react
      # 5+ imports vite 7's './internal' export, so every COLD admin/vendor
      # vite build (CI backend-quality, the DO deploy image) dies with
      # ERR_PACKAGE_PATH_NOT_EXPORTED. Turbo cache hid it until the first
      # cache miss. plugin-react majors move only in lockstep with a vite
      # major, deliberately, in one reviewed PR (reverted in the commit
      # adding this entry).
      - dependency-name: '@vitejs/plugin-react'
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /backend/apps/admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        exclude-patterns:
          - '@medusajs/*'
          - '@mercurjs/*'
        update-types:
          - minor
          - patch
    # Same lockstep rationale as the /backend updater above (@medusajs/* +
    # @mercurjs/* pinned as a family; react/react-dom must move together) —
    # this manifest re-declares those same packages for its own workspace, so
    # it needs the identical ignores or the two updaters could open
    # conflicting PRs for the same underlying resolution.
    ignore:
      - dependency-name: '@medusajs/*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: '@mercurjs/*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: 'react-dom'
        update-types:
          - version-update:semver-major
      - dependency-name: 'react'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
