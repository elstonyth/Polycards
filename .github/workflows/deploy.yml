name: Deploy

# Redeploys each DigitalOcean app only when a push to master changes files its
# build reads. This replaces App Platform's deploy_on_push, which redeployed
# both apps on every push (a skills-only change rebuilt the backend too).
#
# Triggers are push-to-master and manual only. This repo is public and the job
# holds a DigitalOcean token, so never add pull_request(_target) here.
#
# Each app is diffed inside the job from the commit DigitalOcean reports it is
# running, not with `on.push.paths`: GitHub evaluates path filters on at most
# 3,000 files and silently skips the run past that, and a live-commit diff
# also catches up after a failed or skipped deploy.
# .github/scripts/deploy-targets.mjs holds the rules and deploys an app
# whenever its diff can't be computed.
#
# Nothing deploys until master CI passes on the commit: the `gate` job waits
# for ci.yml's `ci-ok` check (.github/scripts/ci-gate.mjs). App Platform builds
# the branch tip rather than a given commit, so each deploy job also re-checks
# that master still points at this commit right before it starts a deploy.
# After a deployment goes ACTIVE, the job checks that every component runs
# this commit and that the public health URL answers, and posts to Discord
# (secret DISCORD_WEBHOOK, optional) when any deploy step fails.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      target:
        description: Which app to redeploy
        type: choice
        options:
          - both
          - backend
          - storefront
        default: both

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # secrets can't appear in a step `if`, so expose only whether one is set.
    env:
      HAS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN != '' }}
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      storefront: ${{ steps.plan.outputs.storefront }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      # Read the commit each app is running, so the plan diffs from what is
      # live rather than from the previous push. Best effort: without the
      # token (or off master) the plan falls back to the push's own range.
      - name: Install doctl
        if: env.HAS_TOKEN == 'true' && github.ref == 'refs/heads/master'
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Read live commits
        id: live
        if: env.HAS_TOKEN == 'true' && github.ref == 'refs/heads/master'
        run: bash .github/scripts/live-commits.sh | tee -a "$GITHUB_OUTPUT"
      - name: Decide which apps changed
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          TARGET: ${{ inputs.target }}
          LIVE_BACKEND: ${{ steps.live.outputs.backend }}
          LIVE_STOREFRONT: ${{ steps.live.outputs.storefront }}
        run: node .github/scripts/deploy-targets.mjs

  # Waits for master CI on this commit. Runs only when an app would deploy, so
  # a docs-only push never waits on (or turns red from) CI.
  gate:
    name: wait for CI
    needs: plan
    if: (needs.plan.outputs.backend == 'true' || needs.plan.outputs.storefront == 'true') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      checks: read
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Wait for ci-ok
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: node .github/scripts/ci-gate.mjs

  # One job per app, gated at job level: a skipped job never joins its
  # concurrency group, so it can't displace a pending deploy of that app.
  # cancel-in-progress stays false: it would only cancel the GitHub job, and a
  # DigitalOcean deploy must never be cancelled. The ref check keeps a manual
  # run from a branch away from the token.
  backend:
    name: deploy backend
    needs: [plan, gate]
    if: needs.plan.outputs.backend == 'true' && needs.gate.outputs.deploy == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - name: Checkout deploy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Deploy and wait
        id: deploy
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash .github/scripts/do-deploy.sh polycards-backend
      # Only when this deployment went live: a skipped or superseded one is
      # checked by the run that replaced it.
      - name: Verify live commit and health
        if: steps.deploy.outputs.active == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash .github/scripts/verify-deploy.sh polycards-backend https://admin.polycards.gg/health "$EXPECTED_SHA"
      - name: Alert Discord
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MESSAGE: "Deploy of polycards-backend at ${{ github.sha }} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: bash .github/scripts/notify-discord.sh "$MESSAGE"

  storefront:
    name: deploy storefront
    needs: [plan, gate]
    if: needs.plan.outputs.storefront == 'true' && needs.gate.outputs.deploy == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy-storefront
      cancel-in-progress: false
    steps:
      - name: Checkout deploy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Deploy and wait
        id: deploy
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash .github/scripts/do-deploy.sh polycards-storefront
      # Only when this deployment went live: a skipped or superseded one is
      # checked by the run that replaced it.
      - name: Verify live commit and health
        if: steps.deploy.outputs.active == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash .github/scripts/verify-deploy.sh polycards-storefront https://polycards.gg/healthz "$EXPECTED_SHA"
      - name: Alert Discord
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MESSAGE: "Deploy of polycards-storefront at ${{ github.sha }} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: bash .github/scripts/notify-discord.sh "$MESSAGE"
